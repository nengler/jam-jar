name: Pages

# Builds the game as a web page (`tse package --engine web`) and publishes it to GitHub Pages, so it can be played in a
# browser, a phone's included, at the repository's Pages address.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two jobs, as GitHub's own Pages workflows have them: the build uploads the page, and the deploy, which starts only once the
  # build has finished, publishes it. With both in one job, deploy-pages asked for the artifact a moment after the upload and
  # sometimes found none ("No artifacts named github-pages"), and a re-run then found two.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tse package . --engine web
      # The fruit book, written from the game's tables, beside the game: <Pages address>/fruits.html.
      - run: node tools/fruit-book.ts dist/jam-jar-web/fruits.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/jam-jar-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
